[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hesabdar"
version = "0.1.0"
description = "فضای کار فایل و داده حسابدار"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
  "python-multipart>=0.0.12",
  "pydantic>=2.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.27.0",
  "xlwt>=1.3.0",
]

[project.scripts]
hesabdar = "hesabdar.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hesabdar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
